<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real2Sim · Pantry</title><style>html,body{margin:0;width:100%;height:100%;background:#10171d}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.modes{position:fixed;top:15px;right:15px;z-index:5;display:flex;gap:5px}.modes button{background:#101a24e8;color:#d9ece5;border:1px solid #ffffff30;border-radius:7px;padding:10px;font:11px system-ui;cursor:pointer}.modes button[aria-pressed=true]{background:#284e4a}.back{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:5;background:#101a24e8;border:1px solid #ffffff30;border-radius:20px;padding:10px 15px;color:#d9ece5;font:12px system-ui;text-decoration:none}.back:focus-visible{outline:2px solid #9edcc3;outline-offset:3px}@media(max-width:650px){.back{top:auto;bottom:12px;font-size:10px;padding:8px 10px}}</style></head><body><iframe id="pantry" src="viewer.html" title="Original pantry guided tour and snack-pickup viewer" allow="fullscreen" allowfullscreen></iframe><nav class="modes" aria-label="Pantry experience"><button id="tour-mode" aria-pressed="true">Original tour</button><button id="object-mode" aria-pressed="false">Object controls</button></nav><a class="back" href="../">← Scene gallery</a><noscript><a class="back" href="viewer.html">Open original viewer</a></noscript><script>const frame=document.getElementById("pantry");for(const [id,source] of [["tour-mode","viewer.html"],["object-mode","objects.html"]])document.getElementById(id).onclick=()=>{frame.src=source;for(const button of document.querySelectorAll(".modes button"))button.setAttribute("aria-pressed",String(button.id===id));};</script></body></html>
