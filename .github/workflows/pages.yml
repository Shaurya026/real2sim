name: Publish project pages
on:
  push:
    paths:
      - 'docs/mesh/**'
      - 'tools/build_pages.py'
      - 'tools/check_mesh_site.py'
      - 'tools/render_guides.py'
      - 'tools/project_metadata.py'
      - 'docs/OWN_VIDEO.md'
      - 'docs/FUTURE_WORK.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify pipeline and browser logic
        run: |
          python3 -m unittest discover -s tests -v
          node --test web/tests/*.test.mjs
          node --input-type=module --check < docs/mesh/inspector.js
          node --input-type=module --check < docs/mesh/room-player.js
          node --check docs/mesh/object-controls.js
          node --check docs/mesh/project-links.js
          node --check docs/mesh/manual.js
      - name: Validate and build
        run: python3 tools/build_pages.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
